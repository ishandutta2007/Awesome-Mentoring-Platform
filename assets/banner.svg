<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.3" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Mesh / Connections (Dynamic Background Aspect) -->
  <g opacity="0.35">
    <!-- Pulse Lines -->
    <path d="M 150,175 Q 350,50 600,175 T 1050,175" fill="none" stroke="#38bdf8" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0,1000;1000,0;0,1000" dur="8s" repeatCount="indefinite" />
    </path>
    <path d="M 150,175 Q 350,300 600,175 T 1050,175" fill="none" stroke="#c084fc" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="1000,0;0,1000;1000,0" dur="8s" repeatCount="indefinite" />
    </path>

    <!-- Floating Background Nodes -->
    <circle cx="150" cy="175" r="40" fill="url(#nodeGrad1)" filter="url(#glow)">
      <animate attributeName="r" values="35;45;35" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="175" r="40" fill="url(#nodeGrad2)" filter="url(#glow)">
      <animate attributeName="r" values="45;35;45" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- Floating Particles -->
    <circle cx="350" cy="90" r="6" fill="#38bdf8">
      <animate attributeName="cy" values="90;70;90" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="850" cy="260" r="8" fill="#c084fc">
      <animate attributeName="cy" values="260;280;260" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="60" r="5" fill="#818cf8">
      <animate attributeName="cy" values="60;45;60" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Foreground Content (Always crisp & legible) -->
  <g text-anchor="middle">
    <!-- Icon / Badge Top -->
    <rect x="530" y="45" width="140" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="600" y="65" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">AWESOME LIST</text>

    <!-- Main Title -->
    <text x="600" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome Mentoring Platform
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">
      Curated SaaS / Hosted Platforms &amp; Open-Source Mentorship Systems
    </text>

    <!-- Feature Tags -->
    <g font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">
      <!-- Tag 1 -->
      <rect x="290" y="240" width="180" height="34" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" />
      <text x="380" y="262" fill="#e2e8f0">🤝 Mentor Matching</text>

      <!-- Tag 2 -->
      <rect x="510" y="240" width="180" height="34" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#818cf8" stroke-width="1" />
      <text x="600" y="262" fill="#e2e8f0">📈 Career Growth</text>

      <!-- Tag 3 -->
      <rect x="730" y="240" width="180" height="34" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#c084fc" stroke-width="1" />
      <text x="820" y="262" fill="#e2e8f0">🌐 Enterprise &amp; OSS</text>
    </g>
  </g>
</svg>
